        let currentFontSize = 18; // Default text size in px

        // Render verses to DOM with Blue theme classes
        function renderVerses() {
            const container = document.getElementById('verseContainer');
            container.innerHTML = verses.map((verse, index) => {
                const verseNum = index + 1;
                return `
                    <div id="verse-${verseNum}" class="verse-card group flex items-start gap-3 sm:gap-4 p-3.5 sm:p-4 rounded-2xl hover:bg-blue-50/70 dark:hover:bg-slate-700/50 border border-transparent hover:border-blue-200 dark:hover:border-slate-600 transition-all duration-200">
                        
                        <!-- Verse Number Badge -->
                        <div class="flex-shrink-0 w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-blue-100 dark:bg-blue-900/60 text-blue-800 dark:text-blue-200 flex items-center justify-center font-bold text-xs sm:text-sm shadow-sm group-hover:bg-blue-600 group-hover:text-white transition-colors">
                            ${verseNum}
                        </div>

                        <!-- Verse Text -->
                        <div class="flex-grow pt-0.5 sm:pt-1">
                            <p class="verse-text leading-relaxed font-medium text-slate-800 dark:text-slate-100" style="font-size: ${currentFontSize}px;">
                                ${verse}
                            </p>
                        </div>

                        <!-- Single Verse Copy Button -->
                        <button 
                            onclick="copySingleVerse(${verseNum}, \`${verse.replace(/`/g, "\\`")}\`)"
                            class="opacity-0 group-hover:opacity-100 focus:opacity-100 p-2 text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 rounded-lg transition-all"
                            title="আয়াত কপি করুন"
                        >
                            <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Font size adjuster
        function changeFontSize(delta) {
            currentFontSize = Math.min(Math.max(currentFontSize + delta, 14), 28);
            const textElements = document.querySelectorAll('.verse-text');
            textElements.forEach(el => el.style.fontSize = `${currentFontSize}px`);
        }

        // Dark Mode Toggle
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        // Single Verse Copying
        function copySingleVerse(num, text) {
            const formatted = `${num}. ${text}`;
            copyToClipboard(formatted, `আয়াত নম্বর ${num} কপি করা হয়েছে!`);
        }

        // Copy All Verses
        function copyAllText() {
            let fullText = "সূরা ইয়াসীন (সম্পূর্ণ ১-৮৩ আয়াত)\n\n";
            verses.forEach((verse, index) => {
                fullText += `${index + 1}. ${verse}\n`;
            });
            copyToClipboard(fullText, "সম্পূর্ণ সূরা ইয়াসীন কপি করা হয়েছে!");
        }

        // Universal Copy Helper
        function copyToClipboard(text, successMessage) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast(successMessage);
        }

        // Toast display
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        // Initialize on load
        window.onload = function() {
            renderVerses();
        };
    </script>
